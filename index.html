<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUNGER MANAGEMENT</title>
    <!-- Critical CSS inlined for instant availability -->
    <style>
        /* Loading Screen - must be first */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e0e0e0;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Card animation - critical for cascade effect */
        .model-card {
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.5s ease forwards;
            animation-play-state: paused;
        }

        .model-card.animate {
            animation-play-state: running;
        }

        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Loading Screen -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <h1><a href="#" onclick="closeProfile(); return false;" class="logo-link">HUNGER MANAGEMENT</a></h1>
    </header>
    <main class="grid-container" id="grid-container">
        <!-- Models will be injected here by script.js -->
    </main>
    <footer class="footer">
        COPYRIGHT 2026 HUNGER MANAGEMENT. ALL RIGHTS RESERVED. LEGAL MENTIONS.
    </footer>
    <div class="profile-container" id="profile-container">
        <div class="profile-content" id="profile-content"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
